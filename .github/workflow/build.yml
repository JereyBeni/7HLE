name: Publicar Release de 7HLE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Se dispara con tags o con pushes a main

jobs:
  build-and-release:
    name: Compilar y empaquetar para Windows
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust (toolchain estable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependencias Cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar 7HLE en modo Release optimizado
        run: cargo build --release

      - name: Preparar artefacto para distribución
        run: |
          mkdir release_dist
          copy target\release\7hle.exe release_dist\7hle.exe
          copy README.md release_dist\README.md

      - name: Subir artefacto de compilación (Para pushes a main)
        uses: actions/upload-artifact@v4
        with:
          name: 7hle-windows-x64
          path: release_dist/7hle.exe

      - name: Crear Release en GitHub (Solo cuando hay tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_dist/7hle.exe
            release_dist/README.md
          body: |
            ### 🚀 7HLE Release oficial
            Versión autocompilada desde GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}